apiVersion: v1
kind: Service
metadata:
  name: product-similarity-service
  labels:
    app: product-similarity-service
spec:
  selector:
    app: product-similarity-service
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: product-similarity-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  rules:
    - host: product-similarity.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: product-similarity-service
                port:
                  number: 80
