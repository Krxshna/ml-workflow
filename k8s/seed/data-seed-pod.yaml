apiVersion: v1
kind: Pod
metadata:
  name: data-seed
spec:
  restartPolicy: Never
  containers:
    - name: data-seed
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: dataset
          mountPath: /data
  volumes:
    - name: dataset
      persistentVolumeClaim:
        claimName: product-similarity-dataset-pvc
