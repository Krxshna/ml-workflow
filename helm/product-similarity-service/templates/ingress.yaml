{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: product-similarity-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "product-similarity-service.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: "{{ .Values.ingress.hostName }}.{{ required "ingress.host is required when ingress.enabled=true (e.g. --set ingress.host=127.0.0.1.nip.io)" .Values.ingress.host }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: product-similarity-service
                port:
                  number: {{ .Values.service.port }}
{{- end }}
